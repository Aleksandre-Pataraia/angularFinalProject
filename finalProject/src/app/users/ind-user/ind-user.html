@if(user$ | async; as user) {

  <div class="user-details">

    <h1>{{ user.name }}</h1>

    <p>{{ user.username }}</p>
    <p>{{ user.email }}</p>
    <p>{{ user.phone }}</p>

    <h3>Address</h3>
    <p>{{ user.address.city }}</p>

    <h3>Company</h3>
    <p>{{ user.company.name }}</p>

  </div>

}  @else {
  <p>Loading user...</p>
}
